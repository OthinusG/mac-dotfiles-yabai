# Docs at https://docs.warp.dev/terminal/windows/tab-configs

name = "research Agent"

[[panes]]
id = "root"
split = "horizontal"
children = ["left", "right"]

[[panes]]
id = "left"
type = "terminal"
directory = "/Users/wqin/Library/Mobile Documents/com~apple~CloudDocs/my_manuscript"
commands = []
is_focused = true

[[panes]]
id = "right"
type = "terminal"
directory = "/Users/wqin/Library/Mobile Documents/com~apple~CloudDocs/my_manuscript"
commands = []